  <rect width="64" height="64" rx="12" fill="#14120f"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#c9bda3" stroke-width="4"/>
  <circle cx="32" cy="32" r="4" fill="#c2502a"/>
</svg>
